spring.application.name=fastcash

# ==============================================================
#  OPCIÓN A: MODO PRODUCCIÓN (RAILWAY HOBBY)
# ==============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

fastcash.security.enabled=true

# SSL OBLIGATORIO PARA RAILWAY
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# ==============================================================
#  OPCIÓN B: MODO PRUEBAS LOCALES (TU PC)
# ==============================================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/DvPrueba
#spring.datasource.username=postgres
#spring.datasource.password=ansu22
#spring.datasource.driver-class-name=org.postgresql.Driver
#fastcash.security.enabled=false

# ==============================================================
#  CONFIGURACIONES GLOBALES Y HORA
# ==============================================================
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Lima'
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ==============================================================
#  OPTIMIZACIÓN EXTREMA: PLAN HOBBY RAILWAY (MENOS RAM Y CPU)
# ==============================================================
# 1. COMPRESIÓN GZIP (Acelera la red)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. HIKARICP (Reducción estricta para no ahogar la RAM de Postgres ni Java)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
# NUEVO: Detecta queries largas o no cerradas para que el Garbage Collector libere la RAM
spring.datasource.hikari.leak-detection-threshold=2000

# 3. TOMCAT EMBEBIDO (Control de memoria Off-Heap y Colas)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
# NUEVO: Evita que Tomcat reserve memoria para rastrear hasta 8192 conexiones (su valor por defecto)
server.tomcat.max-connections=500
# NUEVO: Tamaño de la cola de espera para peticiones cuando los 50 hilos estén ocupados
server.tomcat.accept-count=50

# 4. HIBERNATE & JPA
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 5. JACKSON / JSON (NUEVO: Optimiza parseo ahorrando CPU y RAM)
# Evita enviar campos nulos en los JSON de respuesta, reduciendo el tamaño del payload
spring.jackson.default-property-inclusion=non_null
# Ignora campos enviados en el body que no existan en tu DTO sin lanzar error
spring.jackson.deserialization.fail-on-unknown-properties=false

# 6. SERVIDOR, ARRANQUE Y LOGS (Ahorro de memoria Heap e I/O)
spring.jmx.enabled=false
spring.main.lazy-initialization=true
# NUEVO: Apaga el banner de Spring y evita logs innecesarios al iniciar
spring.main.banner-mode=off
spring.main.log-startup-info=false
# NUEVO: Restringe los logs internos de Spring/Hibernate solo a errores, ahorrando memoria buffer.
# (Cambia 'com.tu.paquete' por el paquete base real de tu proyecto si quieres ver tus propios logs)
logging.level.root=WARN
logging.level.com.tu.paquete=INFO
server.port=${PORT:8080}
